# =============================================================================
# Step 0 / Step 1 Configuration - Hospital Edge Simulator (No AI Yet)
# -----------------------------------------------------------------------------
# Yeh config file saari "magic numbers" ek jagah rakhti hai (project rule:
# "Keep configuration values in a clearly defined configuration section").
# Har hospital department (agent) ka apna edge node hota hai jiski processing
# capacity (per time-step) fixed hai. Deadline abhi is step mein shamil NAHI
# hai -- woh Step 4 mein add hogi.
# =============================================================================

seed: 42                 # reproducibility ke liye fixed random seed

simulation:
  n_steps: 20             # kitne time-steps tak simulator chalega (test run)

departments:
  - name: Emergency
    capacity: 5.0          # is department ka edge node ek step mein 5.0 "compute units" process kar sakta hai
  - name: ICU
    capacity: 4.0
  - name: General_Ward
    capacity: 3.0

# =============================================================================
# Step 2 Configuration - Medical Task Generator (Poisson Arrivals)
# -----------------------------------------------------------------------------
# *** PLACEHOLDER VALUES - NOT YET FROM MIMIC-IV ***
# ROMAN URDU: Yeh numbers abhi "clinically reasonable guess" hain, real
# MIMIC-IV statistics NAHI hain (PhysioNet credentialed access abhi tak nahi
# mila -- roadmap ka Objective 1 admin action). Jab access mil jaye, sirf
# yeahi values update karni hain -- env/task_generator.py ka code nahi
# badalna paray ga.
# ENGLISH: These numbers are a clinically-plausible placeholder, NOT derived
# from MIMIC-IV yet (PhysioNet credentialed access is still pending -- see
# the roadmap's Objective 1 admin action). Once access is granted, only this
# section needs updating; env/task_generator.py reads whatever is here.
#
# arrival_rate: expected number of NEW tasks of this priority, in THIS
#   department, per simulation time-step (the mean of a Poisson draw).
#   Example: 0.10 means, on average, 1 task arrives every 10 steps.
# compute_demand_range: [low, high] for a uniform draw of how many "compute
#   units" the task needs (same units as EdgeNode.capacity above).
#
# ROUTINE RANGE NOTE (post-Step-3 correction): Routine's upper bound is 8.0,
# not 4.0, on purpose -- with the Step 3 'offloading' section below
# (edge_threshold: 6.0, now cloud_threshold), a max of 4.0 meant NO generated
# task could ever exceed that threshold, so the Cloud tier was silently unreachable by any
# realistic (generator-driven) simulation, even though TaskRouter/CloudNode
# were fully implemented and tested with manually-injected tasks. Routine
# tasks (batch analytics / reporting jobs, per the note below) are the
# plausible place for occasional heavy compute_demand, so only their upper
# bound was raised. Still a placeholder pending real MIMIC-IV-derived values.
# =============================================================================
task_generation:
  departments:
    Emergency:
      Critical:
        arrival_rate: 0.10          # rare, but this is the emergency room -> not zero
        compute_demand_range: [1.0, 2.5]
      High:
        arrival_rate: 0.20
        compute_demand_range: [1.5, 3.5]
      Routine:
        arrival_rate: 0.15
        compute_demand_range: [2.0, 8.0]
    ICU:
      Critical:
        arrival_rate: 0.15          # ICU patients are already unstable -> higher Critical rate
        compute_demand_range: [1.0, 2.5]
      High:
        arrival_rate: 0.15
        compute_demand_range: [1.5, 3.5]
      Routine:
        arrival_rate: 0.10
        compute_demand_range: [2.0, 8.0]
    General_Ward:
      Critical:
        arrival_rate: 0.03          # stable patients -> Critical events are rare here
        compute_demand_range: [1.0, 2.5]
      High:
        arrival_rate: 0.10
        compute_demand_range: [1.5, 3.5]
      Routine:
        arrival_rate: 0.25          # routine logging/reporting dominates General Ward traffic
        compute_demand_range: [2.0, 8.0]

# =============================================================================
# Step 3/5 Configuration - Local / Edge(neighbour) / Cloud Offloading  (V2)
# -----------------------------------------------------------------------------
# ROMAN URDU: Roadmap/synopsis ke mutabiq teen actions hain:
#   Local = task source department ke APNE edge node par process ho.
#   Edge  = task kisi DOOSRE (padosi) department ke edge node par offload ho
#           (us department ki ASLI queue/capacity share hoti hai).
#   Cloud = ek shared remote server (network delay ke saath).
# TaskRouter (env/task_router.py) ka FIXED, priority-blind FCFS rule (AI nahi):
#   1. compute_demand > cloud_threshold                    -> Cloud
#   2. warna source node ka backlog <= offload_threshold    -> Local
#   3. warna -> Edge: sab se kam backlog wala padosi; tie par
#      neighbour_tie_break_order (Emergency -> ICU -> General_Ward).
# "backlog" = node ko assign kiye gaye tamam unfinished tasks ki remaining
# demand, transit (raste) wale tasks samet.
#
# ENGLISH: see the rule above. Purana chhota bedside "Local" tier
# (local_capacity / local_threshold / edge_threshold) V2 mein HATA diya gaya
# hai -- woh keys ab error deti hain (purani config galti se na chal jaye).
#
# cloud_capacity: the ONE shared cloud server's compute units per step.
# cloud_network_delay: whole steps a task spends in transit to the cloud
#   (ready_time = arrival_time + delay). Unchanged from Step 3: 2.
# neighbour_network_delay: whole steps in transit to a neighbour department's
#   node. Default 1 (<= cloud delay): an in-hospital LAN hop is assumed faster
#   than the WAN link to a remote cloud, and 1 is the smallest non-zero delay
#   on the discrete step clock. 0 is allowed (ideal LAN), and so is a value
#   larger than the cloud delay (slow-neighbour stress scenarios). PLACEHOLDER.
# cloud_threshold: compute_demand above this -> Cloud (same 6.0 cut-off the old
#   edge_threshold used, so the same tasks are cloud-eligible as before).
# offload_threshold: backlog (compute units) above which the source node is
#   considered too busy. Default 3.0 = capacity of the smallest node
#   (General_Ward): a backlog above it cannot be cleared within one step on
#   the weakest node. PLACEHOLDER, a fixed baseline choice -- not tuned.
# neighbour_tie_break_order: must list every department exactly once. An
#   intentional deterministic preference, NOT a fairness claim.
# =============================================================================
offloading:
  cloud_capacity: 50.0
  cloud_network_delay: 2
  neighbour_network_delay: 1
  cloud_threshold: 6.0
  offload_threshold: 3.0
  neighbour_tie_break_order: [Emergency, ICU, General_Ward]

# =============================================================================
# Step 4 Configuration - Priority Deadlines
# -----------------------------------------------------------------------------
# ROMAN URDU: Har priority class ki apni deadline hoti hai -- kitne time-steps
# arrival ke baad task complete ho jana "chahiye". Yeh abhi sirf TRACK hoti hai
# (Task.met_deadline se) -- koi scheduling decision isay istemal nahi karti,
# queue order abhi bhi Step 1 wala plain FIFO hai. Section poori tarah OPT-IN
# hai (jaise 'offloading'): agar yeh section config se hata diya jaye,
# HospitalSimulator.add_task()/route_task() bilkul waise hi chalte hain jaise
# pehle chalte thay, bas deadline hamesha None rahegi -- koi error nahi.
#
# ENGLISH: Every priority class gets its own deadline -- how many time-steps
# after arrival a task "should" finish by. This is only TRACKED for now (via
# Task.met_deadline) -- no scheduling decision uses it yet; queue order is
# still Step 1's plain FIFO. This section is fully OPT-IN (like 'offloading'):
# remove it and HospitalSimulator.add_task()/route_task() behave exactly as
# before, deadline just stays None -- no error.
#
# deadline_offset: how many steps after arrival_time this priority's tasks
#   are expected to finish by (deadline = arrival_time + deadline_offset).
#   Critical is tightest, Routine is loosest -- still a PLACEHOLDER, pending
#   real MIMIC-IV-derived values (same limitation as task_generation above).
# =============================================================================
deadlines:
  Critical: 2
  High: 5
  Routine: 10
